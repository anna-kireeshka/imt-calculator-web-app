{{define "content"}}
<div class="stack">

  <button class="weight" type="button" id="weight-button" aria-expanded="false" aria-controls="weight-edit">
    <span class="weight__label">Текущий вес</span>
    <span class="weight__value">
      <span id="weight-value">74,2</span><span class="weight__unit">кг</span>
    </span>
    <i class="ti ti-pencil weight__icon" aria-hidden="true"></i>
  </button>

  <form class="weight-edit" id="weight-edit" novalidate hidden>
    <label class="field">
      <span class="field__label">Новый вес, кг</span>
      <input type="number" id="weight-input" inputmode="decimal" step="0.1" min="20" max="400" placeholder="74,2">
    </label>
    <p class="error-text" id="weight-error" role="alert"></p>
    <div class="weight-edit__actions">
      <button class="btn" type="submit">Сохранить</button>
      <button class="btn-quiet" type="button" id="weight-cancel">Отмена</button>
    </div>
  </form>

  <h1 class="page-title">История</h1>

  <p class="error-text" id="history-error" role="alert"></p>
  <p class="muted" id="history-empty" hidden>Пока нет взвешиваний</p>

  <div class="card-grid" id="history-summary" hidden>
    <div class="card">
      <p class="label">Вес</p>
      <span class="figure--small" id="summary-weight">—</span> <span id="summary-weight-delta"></span>
    </div>
    <div class="card">
      <p class="label">ИМТ</p>
      <span class="figure--small" id="summary-imt">—</span> <span id="summary-imt-delta"></span>
    </div>
  </div>

  <div class="card" id="history-chart-card" hidden>
    <svg class="chart" id="history-chart" viewBox="0 0 260 110" role="img" aria-label="График веса">
      <line x1="0" y1="20" x2="260" y2="20" stroke="var(--separator)"/>
      <line x1="0" y1="55" x2="260" y2="55" stroke="var(--separator)"/>
      <line x1="0" y1="90" x2="260" y2="90" stroke="var(--separator)"/>
      <polyline id="chart-line" fill="none" stroke="var(--button)" stroke-width="2" points=""/>
      <circle id="chart-dot" r="4" fill="var(--button)" cx="-10" cy="-10"/>
      <text id="chart-from" x="10" y="106" font-size="11" fill="var(--hint)"></text>
      <text id="chart-to" x="250" y="106" font-size="11" fill="var(--hint)" text-anchor="end"></text>
    </svg>
  </div>

  <div class="card card--list" id="history-list" hidden></div>

</div>
{{end}}

{{define "scripts"}}<script src="/static/js/history.js" defer></script>{{end}}
