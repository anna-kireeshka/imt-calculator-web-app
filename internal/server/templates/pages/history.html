{{define "content"}}
<div class="stack">

  <h1 class="page-title">История</h1>

  <div class="segmented" role="group" aria-label="Период">
    <button type="button" aria-pressed="false">1м</button>
    <button type="button" aria-pressed="true">3м</button>
    <button type="button" aria-pressed="false">6м</button>
    <button type="button" aria-pressed="false">Год</button>
  </div>

  <div class="card-grid">
    <div class="card">
      <p class="label">Вес</p>
      <span class="figure--small">74,2</span> <span class="delta--down">−3,8 кг</span>
    </div>
    <div class="card">
      <p class="label">ИМТ</p>
      <span class="figure--small">23,4</span> <span class="delta--down">−1,2</span>
    </div>
  </div>

  <div class="card">
    <svg class="chart" viewBox="0 0 260 110" role="img" aria-label="Вес снизился с 78 кг в июне до 74,2 кг в сентябре, цель — 72 кг">
      <line x1="0" y1="20" x2="260" y2="20" stroke="var(--separator)"/>
      <line x1="0" y1="55" x2="260" y2="55" stroke="var(--separator)"/>
      <line x1="0" y1="90" x2="260" y2="90" stroke="var(--separator)"/>
      <line x1="0" y1="62" x2="260" y2="62" stroke="var(--ok)" stroke-dasharray="4 3"/>
      <text x="2" y="58" font-size="11" fill="var(--ok)">цель 72</text>
      <polyline fill="none" stroke="var(--button)" stroke-width="2"
                points="10,20 45,28 80,26 115,42 150,40 185,52 220,50 250,56"/>
      <circle cx="250" cy="56" r="4" fill="var(--button)"/>
      <text x="10" y="106" font-size="11" fill="var(--hint)">июн</text>
      <text x="125" y="106" font-size="11" fill="var(--hint)">июл</text>
      <text x="230" y="106" font-size="11" fill="var(--hint)">авг</text>
    </svg>
  </div>

  <div class="card card--list">
    <div class="row"><span>2 сен</span><span>74,2 кг <span class="muted">23,4</span></span></div>
    <div class="row"><span>26 авг</span><span>74,8 кг <span class="muted">23,6</span></span></div>
    <div class="row"><span>19 авг</span><span>75,1 кг <span class="muted">23,7</span></span></div>
  </div>

</div>
{{end}}
