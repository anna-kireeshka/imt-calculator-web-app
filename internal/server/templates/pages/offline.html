{{define "content"}}
<div class="state">
  <div class="state__icon state__icon--warn"><i class="ti ti-wifi-off"></i></div>
  <p class="state__title">Нет соединения</p>
  <p class="state__text">Проверьте интернет и попробуйте снова. Калькуляторы ИМТ и калорий работают без сети.</p>
</div>

<div class="actions">
  <button class="btn" type="button" data-retry><i class="ti ti-refresh"></i> Повторить</button>
  <a class="btn-quiet" href="/">Открыть калькулятор офлайн</a>
</div>
{{end}}
